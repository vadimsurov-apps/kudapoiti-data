name: Сверка выходов метро с Яндекс Картами
on: workflow_dispatch
concurrency:
  group: metro-yandex
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/metro_yandex.py 400
      - if: always()
        run: |
          git config user.name "kudapoiti-bot"; git config user.email "bot@users.noreply.github.com"
          git add auto/metro-exits-yandex.json
          git commit -m "Сверка выходов метро с Яндекс Картами" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep 4; done
