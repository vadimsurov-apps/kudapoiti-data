name: Сборка places.json, иконок и страниц
on:
  push:
    branches: [main]
    paths: ["data/**", "icons-src/**", "tools/xlsx_to_json.py", "tools/build_all.py", "auto/osm-access.json", "auto/osm-changing.json", "deals.json", "auto/spam-domains.txt", "auto/osm-address.json", "auto/contacts.json", "auto/access-needs.json", "auto/cat-ages.json", "auto/verified.json", "auto/human-checks.json", "gpt/reports/**", "tools/point_level.py", "tools/metrics.py", "auto/geo-yandex.json", "auto/yandex-entrances.json", "pipeline/spam.py"]
  workflow_dispatch:
  workflow_run:   # коммиты роботов GitHub сами сборку не запускают — запускаем после поиска входов
    workflows: ["Входы организаций из Яндекс Карт (точка на дверь, этаж в ТЦ)", "Отчёты ChatGPT — разбор и автоприменение", "Приём отчёта Codex из его ответа в pull request", "Приём отчёта ChatGPT из issue", "Приём отчёта ChatGPT из pull request"]
    types: [completed]
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    # после других роботов — только если тот отработал успешно (пропущенные запуски сборку не тянут)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install -q openpyxl cairosvg pillow
      - name: Сборка
        run: |
          git pull -q --rebase origin main || true
          BEFORE="${{ github.event.before }}"
          CHANGED=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- icons-src | sed -n 's#icons-src/\(.*\)\.svg#\1#p' | tr '\n' ' ')
          fi
          python3 tools/build_all.py $CHANGED
      - run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add places.json places-all.json auto/metrics.json auto/metrics-history.json gpt/queue.json auto/call-queue.json gpt/RULES.md auto/gpt-checks.json auto/gpt-disputes.json deals.json icons p icons-catalog auto/table-coords.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Сборка: places.json, иконки, страницы"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 10; done
          exit 1
