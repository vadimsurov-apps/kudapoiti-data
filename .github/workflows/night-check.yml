name: Ночной контроль значков (кто цветной ночью)
# Вадим 14.11: «проверять, нет ли ошибок в размещении аватаров в ночное время… и сейчас и в будущем»
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"   # 00:30 МСК
    - cron: "30 0 * * *"    # 03:30 МСК
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/night_check.py
      - run: |
          git config user.name "kudapoiti-bot"; git config user.email "bot@users.noreply.github.com"
          git add auto/night-check.json
          git commit -m "Ночной контроль значков" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep 4; done
