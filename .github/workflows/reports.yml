name: Telegram-бот ошибок (работает почти непрерывно)
on:
  schedule:
    - cron: "0 */6 * * *"     # новый запуск каждые 6 часов; каждый работает 5 ч 45 мин
    - cron: "*/30 * * * *"    # подстраховка: если бот почему-то не запущен — запустится; если запущен — встанет в очередь и сменит его без перерыва
  workflow_dispatch:
concurrency:
  group: reports
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 pipeline/tg_reports.py --minutes 345
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
