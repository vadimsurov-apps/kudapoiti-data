name: Проба — входы организаций из 2ГИС и Яндекс Карт
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["auto/entrance-probe.json"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/entrance_probe.py
      - run: |
          git config user.name "kudapoiti-bot"; git config user.email "bot@users.noreply.github.com"
          git add auto/entrance-probe-out.json
          git commit -m "Проба входов: ответ" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
