name: Выходы метро и схема линий (OSM, раз в неделю)
on:
  workflow_dispatch:
  schedule:
    - cron: "40 1 * * 1"
concurrency:
  group: metro-exits
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - id: day
        run: echo "d=$(date -u +%F)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: mo.osm.pbf
          key: osm-mo-${{ steps.day.outputs.d }}
          restore-keys: osm-mo-
      - name: Выгрузка OSM (если нет в кэше)
        run: |
          if [ ! -f mo.osm.pbf ]; then
            curl -sSL -o cfd.osm.pbf https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
            osmium extract -b 35.1,54.2,40.3,57.0 cfd.osm.pbf -o mo.osm.pbf --overwrite
          fi
      - name: Метро из OSM
        run: osmium tags-filter -R mo.osm.pbf n/railway=subway_entrance n/railway=station r/public_transport=stop_area -o metro.osm --overwrite
      - run: python3 pipeline/metro_exits.py
      - name: Схема линий и пути (для маршрутов)
        run: |
          osmium tags-filter -R mo.osm.pbf r/route=subway,light_rail,train r/route_master=subway,light_rail,train r/public_transport=stop_area,stop_area_group -o rel.osm --overwrite
          python3 pipeline/metro_graph.py ids rel.osm
          osmium getid -r mo.osm.pbf -i ids.txt -o routes.osm --overwrite
          ls -la rel.osm routes.osm
          python3 pipeline/metro_graph.py build rel.osm routes.osm
      - name: Сохранить
        run: |
          git config user.name "kudapoiti-bot"; git config user.email "bot@users.noreply.github.com"
          git add metro-exits.json metro-graph.json auto/metro-exits-skipped.json auto/metro-exits-report.json auto/metro-graph-report.json
          git commit -m "Выходы метро из OSM" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep 3; done
