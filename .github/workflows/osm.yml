name: Площадки и катки из OSM
on:
  schedule:
    - cron: "17 2 * * *"   # каждый день в 05:17 по Москве
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/fetch_osm.py
      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto/
          git diff --cached --quiet || (git commit -m "OSM: обновление площадок и катков" && git push)
