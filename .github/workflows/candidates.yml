name: Кандидаты в интересные места (OSM)
on:
  schedule:
    - cron: "17 2 * * 1"   # раз в неделю, пн 05:17 МСК
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/fetch_candidates.py
      - run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto/
          git diff --cached --quiet || (git commit -m "OSM: кандидаты в места" && git push)
