name: Сбор акций с сайтов мест
on:
  schedule:
    - cron: "41 0 * * *"   # каждый день в 03:41 МСК
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/fetch_promos.py
      - run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto/
          git diff --cached --quiet || (git commit -m "Акции: свежий обход сайтов" && git pull --rebase && git push)
