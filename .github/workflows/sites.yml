name: Кэш сайтов для роботов (тексты в auto/pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["auto/fetch-queue.txt"]
  schedule:
    - cron: "17 0 * * *"   # каждую ночь 03:17 МСК — новые кандидаты
concurrency:
  group: sites
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/fetch_sites.py
        timeout-minutes: 100
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto/pages auto/spam-domains.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "Кэш сайтов для роботов"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 10; done
