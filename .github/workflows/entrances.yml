name: Входы больших объектов (OSM)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  entrances:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/entrances.py
      - run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto/
          git diff --cached --quiet || (git commit -m "Входы: отчёт по OSM" && git pull --rebase && git push)
