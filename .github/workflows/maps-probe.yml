name: maps-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/maps_probe.js
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe/}
