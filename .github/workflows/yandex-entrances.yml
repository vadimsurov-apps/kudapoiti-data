name: Входы организаций из Яндекс Карт (точка на дверь, этаж в ТЦ)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: yandex-entrances
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/yandex_entrances.py 150
      - run: |
          git config user.name "kudapoiti-bot"; git config user.email "bot@users.noreply.github.com"
          git add auto/yandex-entrances.json
          git commit -m "Входы организаций из Яндекс Карт" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
