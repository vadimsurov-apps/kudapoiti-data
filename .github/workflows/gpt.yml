name: Отчёты ChatGPT — разбор и автоприменение
# Вадим 10.11: находки GPT со ссылкой-источником применяются сразу, без людей.
# Запускается, когда GPT (Codex) кладёт отчёт в gpt/reports/, и раз в час — добрать места, чьи таблицы были под замком.
on:
  push:
    branches: [main]
    paths: ["gpt/reports/**"]
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
  workflow_call:
concurrency:
  group: gpt-apply
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install -q openpyxl cairosvg pillow
      - name: Разобрать, применить, собрать, запушить
        run: |
          git config user.name "kudapoiti-bot"
          git config user.email "bot@users.noreply.github.com"
          # 12.11: сборку здесь больше не делаем — пока она шла (минуты), другие роботы успевали запушить, и push отклонялся
          # три раза подряд (находки Codex не применились). Теперь пушим только исходные данные (секунды), а карту
          # собирает build.yml — он запускается после этого робота (workflow_run).
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/gpt_import.py
            python3 tools/gpt_apply.py
            git add data auto/verified.json auto/contacts.json auto/access-needs.json auto/gpt-checks.json \
              auto/gpt-disputes.json auto/gpt-applied.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "ChatGPT: находки применены автоматически"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
